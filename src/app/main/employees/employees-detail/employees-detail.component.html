<o-form #form attr="employee_form_edit" service="employees" entity="employee" keys="EMPLOYEEID" keys-sql-types="INTEGER"
  (onDataLoaded)="onDataLoaded($event)" editable-detail="no" show-header="no" layout-direction="column"
  columns="EMPLOYEEID;EMPLOYEEPHOTO;EMPLOYEENAME;EMPLOYEESURNAME;EMPLOYEESTARTDATE;EMPLOYEEEMAIL;OFFICEID;EMPLOYEEPHONE;EMPLOYEETYPEID;EMPLOYEEADDRESS">
  <div fxLayout="column" fxLayoutAlign="space-evenly stretch" class="employee-detail" fxFill>


      <div fxLayout="column" fxLayoutAlign="center center" fxFlex="30">
        <div class="image">
          <img [src]="getImageSrc(data?.EMPLOYEEPHOTO)" >
        </div>
        <span class="employee-name">{{ data.EMPLOYEENAME }} {{ data.EMPLOYEESURNAME }}</span>
        <mat-divider></mat-divider>
        <span class="employee-type">{{ 'EMPLOYEETYPE_' + data.EMPLOYEETYPEID | oTranslate }}</span>
        <mat-divider></mat-divider>
      </div>
      <o-column title="EMPLOYEE_DATA" fxLayout="column" class="employee-data" icon="account_circle">
        <span *ngIf="data.EMPLOYEEEMAIL">
          <mat-icon>email</mat-icon>{{ data.EMPLOYEEEMAIL }}
        </span>
        <span *ngIf="data.EMPLOYEEPHONE">
          <mat-icon>smartphone</mat-icon>{{ data.EMPLOYEEPHONE }}
        </span>
        <span *ngIf="data.EMPLOYEEADDRESS">
          <mat-icon>home</mat-icon>{{ data.EMPLOYEEADDRESS }}
        </span>
      </o-column>
    </div>

</o-form>
