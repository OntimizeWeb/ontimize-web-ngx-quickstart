<div class="card-title o-flex">{{ 'EMPLOYEES_TOTAL' | oTranslate }}</div>
<div class="employees-card-employees-amount o-flex">{{ employeesAmount }}</div>
<div class="card-title o-flex">{{ 'EMPLOYEES_CATEGORIES' | oTranslate }}</div>
<o-chart type="multiBarHorizontalChart" x-label="Axis x" y-label="Axis Y" service="employees" entity="employeeTypeAggregate" x-axis="EMPLOYEETYPENAME"
  y-axis="AMOUNT" [chart-parameters]="chartParameters" [color]="scheme" class="employees-card-chart"
show-y-axis-label="false" show-x-axis-label = "false"></o-chart>
